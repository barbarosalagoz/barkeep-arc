# Built and tested with Arc Foundry (arc-forge), not upstream forge: the tests
# run against Arc's own EVM with the protocol's system contracts in place, USDC
# at 0x3600… included. Upstream forge would run them under Ethereum rules with
# no USDC there, and Sanity.t.sol fails loudly if that ever happens.
# https://github.com/circlefin/arc-foundry
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
network = "arc"
solc = "0.8.30"
# At or below Arc's instruction set (Osaka baseline).
evm_version = "prague"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = []
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
