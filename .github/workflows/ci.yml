name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Arc Foundry, not upstream Foundry: foundry-rs/foundry-toolchain would run these
  # tests under Ethereum rules with no USDC at 0x3600… . Pinned and checksummed.
  ARC_FOUNDRY_VERSION: v0.8.0-1
  ARC_FOUNDRY_SHA256: e12feade22e9c276c4e10b3a9e2573e75ef9dcd652f237f9eb6408b7eb52c5f0

jobs:
  contracts:
    name: Contracts (arc-forge against arc-anvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Arc Foundry
        run: ./.github/install-arc-foundry.sh
      - name: Format
        working-directory: contracts
        run: arc-forge fmt --check
      - name: Start a local Arc chain
        run: |
          arc-anvil --network arc --port 8555 > arc-anvil.log 2>&1 &
          for i in $(seq 1 60); do arc-cast chain-id --rpc-url http://127.0.0.1:8555 && break; sleep 1; done
          test "$(arc-cast rpc anvil_nodeInfo --rpc-url http://127.0.0.1:8555 | jq -r .network)" = "arc"
      - name: Unit, fuzz and invariant tests against Arc's real USDC
        working-directory: contracts
        run: arc-forge test --fork-url http://127.0.0.1:8555
      - name: Every security check is covered (mutation check)
        working-directory: contracts
        run: python3 script/mutation-check.py http://127.0.0.1:8555

  fork:
    name: Contracts against a fork of live Arc Testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Arc Foundry
        run: ./.github/install-arc-foundry.sh
      - name: Same suite, forked from the public Testnet RPC
        working-directory: contracts
        run: arc-forge test --fork-url https://rpc.testnet.arc.io

  slither:
    name: Slither (no high or medium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Arc Foundry
        run: ./.github/install-arc-foundry.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6
      - name: Slither
        working-directory: contracts
        # crytic-compile shells out to `forge`; give it Arc's.
        # slither.config.json sets fail_on: medium. Suppressions are inline and listed in docs/SECURITY.md.
        run: |
          mkdir -p "$HOME/as-forge" && ln -sf "$(command -v arc-forge)" "$HOME/as-forge/forge"
          PATH="$HOME/as-forge:$PATH" slither .

  mcp-server:
    name: MCP server (typecheck, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Offline: no chain, no network. Includes boundary.test.ts, which fails if anything the server imports can
      # reach the owner's key or send a transaction.
      - run: npm run test:unit

  integration:
    name: MCP server against the real contracts and USDC (local Arc chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Arc Foundry
        run: ./.github/install-arc-foundry.sh
      - run: npm ci
      - name: Build the contracts the test deploys
        working-directory: contracts
        run: arc-forge build
      - name: Start a local Arc chain
        run: |
          arc-anvil --network arc --port 8555 > arc-anvil.log 2>&1 &
          for i in $(seq 1 60); do arc-cast chain-id --rpc-url http://127.0.0.1:8555 && break; sleep 1; done
      - name: open, pay, refuse, recover, close, expire (A1 to A6, rehearsed locally)
        run: ARC_ANVIL_RPC=http://127.0.0.1:8555 npm run test:int

  secret-hygiene:
    name: No secrets in version control, now or ever
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The scanner catches what it should and spares what it should
        run: python3 .github/secret-scan.py --self-test
      - name: No secret-bearing file name, private key or mnemonic in the index or in any commit
        # .gitignore is the control; this is the check that it is actually working.
        run: python3 .github/secret-scan.py
